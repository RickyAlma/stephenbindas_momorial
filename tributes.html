<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guest Book | Pastor Stephen H. Bindas</title>
    <meta name="description" content="Read the tributes shared in memory of Pastor Stephen H. Bindas.">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guestbook.js" defer></script>
</head>

<body class="guestbook-page">
    <header class="site-header scrolled">
        <nav class="nav container" aria-label="Main navigation">
            <a class="brand" href="index.html#home" aria-label="Return to memorial home"><span
                    class="brand-mark">◐</span><span>Pastor S. H. Bindas</span></a>
            <div class="guestbook-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#story">Life</a>
                <a href="index.html#legacy">Stories</a>
                <a class="button button-outline" href="index.html#tributes">Leave a tribute</a>
            </div>
        </nav>
    </header>

    <main class="guestbook-main">
        <div class="container">
            <div class="guestbook-heading">
                <p class="eyebrow">The guestbook</p>
                <h1>Tributes shared in his memory.</h1>
                <p>Read every message shared by friends and family. Each tribute is shown in full and can grow to fit its message.</p>
            </div>
            <div class="list-header">
                <h2>All tributes</h2>
                <label class="search-box"><span class="sr-only">Search tributes</span><input id="guestbook-search"
                        type="search" placeholder="Search tributes..."><span aria-hidden="true">⌕</span></label>
            </div>
            <p class="guestbook-status" id="guestbook-status" role="status" aria-live="polite">Loading tributes...</p>
            <div class="guestbook-feed" id="all-tributes-list"></div>
        </div>
    </main>
</body>

</html>
